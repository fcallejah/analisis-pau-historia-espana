<title id="title">Resultados de la Restauración: porcentaje de escaños</title>
<desc id="desc">Redibujo vectorial de la tabla del PDF; cifras y subrayados conservados. NOTA: Las cifras subrayadas indican que el partido está en el poder a la hora de presidir las elecciones. Subrayados de la fuente: 1891, Conservador; 1893, Liberal; 1898, Liberal; 1899, Conservador; 1901, Liberal. En 1896 no se añade un subrayado que no aparece en el original. Se conserva el 85,5 de la suma de 1893, aunque las dos cifras de la fuente suman 85,4.</desc>
