<svg xmlns="http://www.w3.org/2000/svg" width="760" height="646" viewBox="0 0 760 646" role="img" aria-labelledby="title desc">
<title id="title">Resultado elecciones 1989 (29 de octubre)</title>
<desc id="desc">Diagrama semicircular proporcional a los 350 escaños, con las candidaturas y sus porcentajes de representación a la derecha. Las candidaturas y coaliciones señaladas se agrupan; el desglose completo aparece en la tabla. La línea discontinua marca la mitad; la mayoría absoluta requiere 176 escaños. *Otros escaños: Eusko Alderdi Jetzalea - Partido Nacionalista Vasco (EAJ-PNV): 5; Iniciativa per Catalunya (IC): 3; Herri Batasuna (HB): 4; Partido Andalucista (PA): 2; Unión Valenciana (UV): 2; Eusko Alkartasuna (EA): 2; Euskadiko Ezkerra (EE): 2; Partido Aragonés Regionalista (PAR): 1; Agrupaciones Independientes de Canarias (AIC): 1.</desc>
