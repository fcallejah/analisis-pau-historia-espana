<svg xmlns="http://www.w3.org/2000/svg" width="760" height="630" viewBox="0 0 760 630" role="img" aria-labelledby="title desc">
<title id="title">Resultado elecciones 1982 (28 de octubre)</title>
<desc id="desc">Diagrama semicircular proporcional a los 350 escaños, con las candidaturas y sus porcentajes de representación a la derecha. Las candidaturas y coaliciones señaladas se agrupan; el desglose completo aparece en la tabla. La línea discontinua marca la mitad; la mayoría absoluta requiere 176 escaños. *Otros escaños: Partido Comunista de España (PCE): 3; Centro Democrático y Social (CDS): 2; Herri Batasuna (HB): 2; Partit Socialista Unificat de Catalunya (PSUC): 1; Esquerra Republicana de Catalunya (ERC): 1; Euskadiko Ezkerra (EE): 1.</desc>
