<svg xmlns="http://www.w3.org/2000/svg" width="760" height="648" viewBox="0 0 760 648" role="img" aria-labelledby="title desc">
<title id="title">Resultado elecciones 2008 (9 de marzo)</title>
<desc id="desc">Diagrama semicircular proporcional a los 350 escaños, con las candidaturas y sus porcentajes de representación a la derecha. Las candidaturas y coaliciones señaladas se agrupan; el desglose completo aparece en la tabla. La línea discontinua marca la mitad; la mayoría absoluta requiere 176 escaños. *Otros escaños: Izquierda Unida (IU): 2; Bloque Nacionalista Galego (BNG): 2; Coalición Canaria - Partido Nacionalista Canario (CC-PNC): 2; Unión, Progreso y Democracia (UPyD): 1; Coalición Nafarroa Bai (NA-BAI): 1.</desc>
