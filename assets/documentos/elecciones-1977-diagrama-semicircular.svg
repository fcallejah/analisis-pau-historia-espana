<title id="title">Resultado elecciones 1977 (15 de junio)</title>
<desc id="desc">Diagrama semicircular de votos y escaños de las elecciones generales del 15 de junio de 1977. «Otros*» agrupa los escaños de PSP-US (Partido Socialista Popular-Unidad Socialista), UDC-CD (Unió del Centre i la Democràcia Cristiana de Catalunya), EC-FED (Esquerra de Catalunya), EE (Euskadiko Ezkerra) y CIC (candidaturas independientes de centro).</desc>
