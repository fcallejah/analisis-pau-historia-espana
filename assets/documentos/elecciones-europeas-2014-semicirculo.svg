<title id="title">Resultado elecciones europeas 2014 (25 de mayo)*</title>
<desc id="desc">Diagrama semicircular proporcional a los 54 escaños, con las candidaturas y sus porcentajes de representación a la derecha. Las candidaturas y coaliciones señaladas se agrupan; el desglose completo aparece en la tabla. Se representan únicamente los escaños asignados a España. *Otros escaños: L&#x27;Esquerra pel Dret a Decidir (EPDD): 2; Ciudadanos-Partido de la Ciudadanía (C&#x27;s): 2; Los Pueblos Deciden (LPD): 1; Primavera Europea: 1.</desc>
