<svg xmlns="http://www.w3.org/2000/svg" width="760" height="599" viewBox="0 0 760 599" role="img" aria-labelledby="title desc">
<title id="title">Elecciones generales de 1931: escaños en las Cortes</title>
<desc id="desc">Diagrama semicircular proporcional a los 470 escaños, con las candidaturas y sus porcentajes de representación a la derecha. Las candidaturas y coaliciones señaladas se agrupan; el desglose completo aparece en la tabla. La línea discontinua marca la mitad; la mayoría absoluta requiere 236 escaños. *Otros escaños: Al Servicio de la República: 13; Federales: 20; Republicanos independientes de izquierda: 6; Partido Republicano Liberal Demócrata: 4; Otros de centro-derecha: 17; Independientes de centro-derecha: 13; Agrarios: 15; Acción Nacional: 5; Tradicionalistas: 8; Monárquicos: 2.</desc>
