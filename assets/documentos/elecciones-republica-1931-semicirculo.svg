<svg xmlns="http://www.w3.org/2000/svg" width="760" height="545" viewBox="0 0 760 545" role="img" aria-labelledby="title desc">
<title id="title">Elecciones generales de 1931: escaños en las Cortes</title>
<desc id="desc">Diagrama semicircular proporcional a los 470 escaños, con las candidaturas y sus porcentajes de representación a la derecha. Las candidaturas y coaliciones señaladas se agrupan; el desglose completo aparece en la tabla. La línea discontinua marca la mitad; la mayoría absoluta requiere 236 escaños.</desc>
