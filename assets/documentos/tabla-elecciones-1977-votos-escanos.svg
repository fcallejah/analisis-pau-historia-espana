<svg xmlns="http://www.w3.org/2000/svg" width="687" height="438" viewBox="0 0 1128 719" role="img" aria-labelledby="title desc">
<title id="title">Resultado elecciones 1977 (15 de junio)</title>
<desc id="desc">Redibujo vectorial de la tabla del PDF; cifras y subrayados conservados. Voto de UCD: 6 310 391 según la cifra consolidada del Ministerio del Interior. Las restantes cifras de votos se mantienen según el resumen de la JEC. PSOE incluye PSC-PSOE; PCE incluye PSUC. Otros reúne UDC-CD, EC-FED, EE y dos candidaturas independientes de centro; no es un grupo parlamentario. La distribución de escaños sigue la agrupación del material del examen: UCD 166; Otros 5 en esta tabla (11 junto con PSP-US en el diagrama). Porcentajes calculados sobre 350. Fuente: Junta Electoral Central, resumen de resultados, página 5: https://www.juntaelectoralcentral.es/cs/jec/documentos/GENERALES_1977_Resultados.pdf Voto de UCD: Ministerio del Interior, Infoelectoral: https://infoelectoral.interior.gob.es/es/elecciones-celebradas/area-de-descargas/index.html</desc>
