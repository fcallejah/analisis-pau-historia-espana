<svg xmlns="http://www.w3.org/2000/svg" width="760" height="599" viewBox="0 0 760 599" role="img" aria-labelledby="title desc">
<title id="title">Elecciones generales de 1933: escaños en las Cortes</title>
<desc id="desc">Diagrama semicircular proporcional a los 473 escaños, con las candidaturas y sus porcentajes de representación a la derecha. Las candidaturas y coaliciones señaladas se agrupan; el desglose completo aparece en la tabla. La línea discontinua marca la mitad; la mayoría absoluta requiere 237 escaños. *Otros escaños: Partido Comunista de España: 1; Radical-socialistas y PRRSI: 4; Acción Republicana: 5; Republicanos federales: 4; Republicanos independientes: 5; Partido Republicano Conservador: 17; Partido Republicano Liberal Demócrata: 9; Independientes de derecha: 13; Comunión Tradicionalista: 20; Monárquicos y Falange: 20.</desc>
