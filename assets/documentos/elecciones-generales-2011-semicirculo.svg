<title id="title">Resultado elecciones 2011 (20 de noviembre)</title>
<desc id="desc">Diagrama semicircular proporcional a los 350 escaños, con las candidaturas y sus porcentajes de representación a la derecha. Las candidaturas y coaliciones señaladas se agrupan; el desglose completo aparece en la tabla. La línea discontinua marca la mitad; la mayoría absoluta requiere 176 escaños. *Otros escaños: Coalición AMAIUR: 7; Unión Progreso y Democracia (UPyD): 5; Eusko Alderdi Jeltzalea-Partido Nacionalista Vasco (EAJ-PNV): 5; Coalición &quot;Esquerra Republicana de Catalunya&quot; (ERC/ESQUERRA): 3; Bloque Nacionalista Galego (BNG): 2; Coalición &quot;Coalición Canaria-Nueva Canarias&quot; (CC-NC-PNC): 2; Coalición &quot;Bloc-Iniciativa-Verds-Equo-Coalició Compromís&quot; (Compromís-Q): 1; Foro de Ciudadanos (FAC): 1; Geroa Bai (GBAI): 1.</desc>
