<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" role="img" aria-labelledby="title desc">
<title id="title">Resultado elecciones 2000 (12 de marzo)</title>
<desc id="desc">Diagrama semicircular proporcional a los 350 escaños, con las candidaturas y sus porcentajes de representación a la derecha. Las candidaturas y coaliciones señaladas se agrupan; el desglose completo aparece en la tabla. La línea discontinua marca la mitad; la mayoría absoluta requiere 176 escaños. *Otros escaños: Bloque Nacionalista Galego (BNG): 3; Partido Andalucista (PA): 1; Esquerra Republicana de Catalunya (ERC): 1; Iniciativa per Catalunya-Verds (IC-V): 1; Eusko Alkartasuna (EA): 1; Chunta Aragonesista (CHA): 1.</desc>
