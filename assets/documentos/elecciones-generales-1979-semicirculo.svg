<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" role="img" aria-labelledby="title desc">
<title id="title">Resultado elecciones 1979 (1 de marzo)</title>
<desc id="desc">Diagrama semicircular proporcional a los 350 escaños, con las candidaturas y sus porcentajes de representación a la derecha. Las candidaturas y coaliciones señaladas se agrupan; el desglose completo aparece en la tabla. La línea discontinua marca la mitad; la mayoría absoluta requiere 176 escaños. *Otros escaños: Unión Nacional (UN): 1; Partido Socialista de Andalucía - Partido Andaluz (PSA-PA): 5; Herri Batasuna (HB): 3; Esquerra Republica de Catalunya (ERC) ***: 1; Euskadiko Ezkerra (EE): 1; Unión del Pueblo Canario (UPC): 1; Partido Aragonés Regionalista (PAR): 1; Unión del Pueblo Navarro (UPN): 1.</desc>
